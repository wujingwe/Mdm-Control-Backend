[project]
name = "mdm-control-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "bcrypt>=4.0.0,<5.0.0",
    "cryptography>=44.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "faststream[rabbit]>=0.7.0",
    "greenlet>=3.0.0",
    "httpx>=0.28.0",
    "passlib>=1.7.4",
    "pyjwt>=2.9.0",
    "pymysql>=1.1.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
plugins = "sqlalchemy.ext.mypy.plugin"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_any_unimported = false
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["app.*"]
disallow_untyped_defs = true

[tool.ruff.lint]
ignore = [
    "ANN",   # missing annotations — mypy handles this
    "D",     # docstrings — not this project's convention
    "INP001", # PEP 420 namespace packages — intentional
    "S101",  # assert in tests — pytest convention
]

[dependency-groups]
dev = [
    "mypy",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff",
]


